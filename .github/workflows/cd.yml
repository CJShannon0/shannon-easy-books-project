name: Deploy to itch.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WebGL
            targetPlatform: WebGL
          - name: Windows
            targetPlatform: StandaloneWindows64
    # For a Unity Personal license, add UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD
    # as GitHub repository secrets. Use your Unity activation method if you have another license type.
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          unityVersion: 6000.5.10f1
          targetPlatform: ${{ matrix.targetPlatform }}
          buildsPath: build
          buildName: ${{ matrix.name }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.name }}
          path: build/${{ matrix.targetPlatform }}
          if-no-files-found: error

  deploy:
    name: Deploy builds to itch.io
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: Build-*
          path: artifacts

      - name: Install Butler
        shell: bash
        run: |
          curl --fail --location --silent --show-error -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          sudo mv butler /usr/local/bin/butler

      - name: Deploy to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCHIO_API_KEY }}
        shell: bash
        run: |
          butler push artifacts/Build-WebGL davideslearning/rize-easy-books-projects:html5
          butler push artifacts/Build-Windows davideslearning/rize-easy-books-projects:windows